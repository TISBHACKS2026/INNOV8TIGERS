<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – UrbisX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="language-styles.css">
    <meta name="description" content="Sign in to UrbisX - Urban Analytics Platform">
</head>
<body>
    <div id="scrollProgress" class="scroll-progress" aria-hidden="true"></div>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-inner">
            <a class="brand" href="index.html">
                <img src="cropped_circle_image.png" alt="UrbisX Logo" />
                <h1>UrbisX</h1>
            </a>
            <div class="nav-actions">
                <a href="index.html#features" data-i18n="nav.features">Features</a>
                <a href="index.html#how" data-i18n="nav.howItWorks">How it Works</a>
                <div id="languageSelector"></div>
                <a href="signup.html" class="btn btn-secondary" data-i18n="nav.signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero hero--subtle">
        <div class="container hero-content reveal-up">
            <h2 data-i18n="auth.loginTitle">Welcome back</h2>
            <p data-i18n="auth.loginSubtitle">Sign in to access your urban analytics dashboard</p>
        </div>
    </header>

    <!-- Form -->
    <section class="section">
        <div class="container form-wrap">
            <div class="form-card reveal-up">
                <form id="loginForm" novalidate>
                    <div class="input-group reveal-up">
                        <label for="email" data-i18n="auth.email">Email address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            placeholder="you@example.com"
                        >
                        <div class="error" id="emailError"></div>
                    </div>

                    <div class="input-group reveal-up" style="margin-top: 12px;">
                        <label for="password" data-i18n="auth.password">Password</label>
                        <div class="password-input">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                required 
                                autocomplete="current-password"
                                placeholder="Enter your password"
                            >
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="error" id="passwordError"></div>
                    </div>

                    <div class="form-options reveal-up" style="margin-top: 12px;">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span class="checkmark"></span>
                            <span data-i18n="auth.rememberMe">Remember me</span>
                        </label>
                        <a href="forgot-password.html" class="forgot-link" data-i18n="auth.forgotPassword">Forgot password?</a>
                    </div>

                    <div class="actions reveal-up">
                        <button type="submit" class="btn btn-primary" id="loginBtn">
                            <span class="btn-text" data-i18n="auth.loginButton">Sign in</span>
                            <div class="btn-loader" style="display: none;">
                                <div class="spinner"></div>
                            </div>
                        </button>
                        <button type="button" class="btn btn-secondary" id="demoBtn">
                            Use Demo Account
                        </button>
                    </div>
                    
                    <div id="formError" class="error" role="status" aria-live="polite"></div>
                    <div id="formSuccess" class="success" role="status" aria-live="polite" style="display: none;">Sign in successful!</div>
                </form>
                <div class="form-footer">
                    <p data-i18n="auth.noAccount">Don't have an account?</p>
                    <a href="signup.html" class="form-link" data-i18n="auth.signupLink">Sign up here</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; <span id="year"></span> UrbisX. Built for equitable urban development.</p>
        </div>
    </footer>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="translations.js"></script>
    <script src="language-manager.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Initialize login page
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize language manager
            const langManager = initLanguageManager(supabaseClient);
            await langManager.loadUserLanguage();
            langManager.createLanguageSelector('languageSelector');
            langManager.updatePageLanguage();
            
            initializeLoginPage();
            initializeAnimations();
        });
        
        function initializeLoginPage() {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const loginBtn = document.getElementById('loginBtn');
            const demoBtn = document.getElementById('demoBtn');

            // Check if already logged in
            if (auth.isAuthenticated) {
                const urlParams = new URLSearchParams(window.location.search);
                const redirect = urlParams.get('redirect') || 'index.html';
                window.location.href = redirect;
                return;
            }

            // Password toggle functionality
            if (passwordToggle) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordInput.type === 'password' ? 'text' : 'password';
                    passwordInput.type = type;
                    
                    const eyeIcon = this.querySelector('.eye-icon');
                    const eyeOffIcon = this.querySelector('.eye-off-icon');
                    
                    if (type === 'text') {
                        eyeIcon.style.display = 'none';
                        eyeOffIcon.style.display = 'block';
                    } else {
                        eyeIcon.style.display = 'block';
                        eyeOffIcon.style.display = 'none';
                    }
                });
            }

            // Demo account button
            if (demoBtn) {
                demoBtn.addEventListener('click', function() {
                    emailInput.value = 'demo@urbisx.com';
                    passwordInput.value = 'demo123456';
                    clearErrors();
                });
            }

            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                // Clear previous errors
                clearErrors();
                
                // Validate form
                if (!validateForm(email, password)) return;
                
                // Show loading state
                setLoadingState(true);
                
                try {
                    const result = await auth.signIn(email, password);
                    
                    if (result.success) {
                        // Show success message briefly
                        showSuccess('Sign in successful!');
                        
                        // Load user's language preference after successful login
                        const langManager = initLanguageManager(supabaseClient);
                        await langManager.loadUserLanguage();
                        langManager.updatePageLanguage();
                        
                        // Log activity
                        await db.logUserActivity({
                            type: 'login',
                            data: { email }
                        });
                        
                        // Redirect to appropriate page
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirect = urlParams.get('redirect') || 'index.html';
                        setTimeout(() => {
                            window.location.href = redirect;
                        }, 1000);
                    } else {
                        showError(result.error);
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showError('An unexpected error occurred. Please try again.');
                } finally {
                    setLoadingState(false);
                }
            });

            function validateForm(email, password) {
                let isValid = true;

                if (!email) {
                    showFieldError('email', 'Email is required');
                    isValid = false;
                } else if (!auth.isValidEmail(email)) {
                    showFieldError('email', 'Please enter a valid email address');
                    isValid = false;
                }

                if (!password) {
                    showFieldError('password', 'Password is required');
                    isValid = false;
                }

                return isValid;
            }

            function showFieldError(fieldName, message) {
                const errorElement = document.getElementById(`${fieldName}Error`);
                const inputGroup = document.getElementById(fieldName).closest('.input-group');
                
                if (errorElement) {
                    errorElement.textContent = message;
                    errorElement.style.display = 'block';
                }
                
                if (inputGroup) {
                    inputGroup.classList.add('invalid');
                }
            }

            function clearErrors() {
                document.querySelectorAll('.error').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.input-group').forEach(el => {
                    el.classList.remove('invalid');
                });
            }

            function showError(message) {
                const formError = document.getElementById('formError');
                formError.textContent = message;
                formError.style.display = 'block';
            }

            function showSuccess(message) {
                const formSuccess = document.getElementById('formSuccess');
                formSuccess.textContent = message;
                formSuccess.style.display = 'block';
            }

            function setLoadingState(loading) {
                loginBtn.disabled = loading;
                loginBtn.querySelector('.btn-text').style.display = loading ? 'none' : 'block';
                loginBtn.querySelector('.btn-loader').style.display = loading ? 'flex' : 'none';
            }
        }
        
        function initializeAnimations() {
            // Scroll-reveal animations
            try {
                const els = document.querySelectorAll('.reveal-up');
                if (!('IntersectionObserver' in window) || els.length === 0) {
                    els.forEach(el => el.classList.add('is-visible'));
                    return;
                }
                const io = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            io.unobserve(entry.target);
                        }
                    });
                }, { rootMargin: '0px 0px -10% 0px', threshold: 0.1 });
                els.forEach(el => io.observe(el));
            } catch (_) { /* no-op */ }
            
            // Navbar elevation on scroll
            try {
                const nav = document.querySelector('.navbar');
                if (!nav) return;
                let last = false;
                function onScroll() {
                    const elevated = window.scrollY > 8;
                    if (elevated !== last) {
                        nav.classList.toggle('navbar--elevated', elevated);
                        last = elevated;
                    }
                }
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
            } catch (_) { /* no-op */ }
            
            // Scroll progress bar
            try {
                const bar = document.getElementById('scrollProgress');
                if (!bar) return;
                function onScroll() {
                    const h = document.documentElement;
                    const max = Math.max(1, h.scrollHeight - window.innerHeight);
                    const pct = Math.max(0, Math.min(1, window.scrollY / max));
                    bar.style.width = (pct * 100).toFixed(1) + '%';
                }
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                onScroll();
            } catch (_) { /* no-op */ }
        }
    </script>
    
    <!-- Language Manager -->
    <script src="translations.js"></script>
    <script src="language-manager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize language manager
            const langManager = initLanguageManager(supabaseClient);
            await langManager.loadUserLanguage();
            langManager.createLanguageSelector('languageSelector');
            langManager.updatePageLanguage();
        });
    </script>
</body>
</html>
